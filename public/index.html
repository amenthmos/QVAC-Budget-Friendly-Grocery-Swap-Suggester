<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Budget-Friendly Grocery Swap Suggester</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #eafaf0 0%, #d3f2df 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #1e4a30;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; }
  .icon { font-size: 2rem; margin-bottom: 4px; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #1e7d42; font-weight: 800; text-align: center; }
  .subtitle { color: #4a7a5e; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card { background: #ffffff; border: 1px solid #cdeedb; border-radius: 16px; padding: 28px 26px; box-shadow: 0 4px 16px rgba(30,125,66,0.08); }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #1e4a30; }
  input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #b6e2c8;
    background: #f7fdf9; color: #1e4a30; font-family: inherit; font-size: 1rem; margin-bottom: 18px;
  }
  input[type=text]:focus { outline: none; border-color: #1e7d42; }
  button.action {
    width: 100%; padding: 13px 20px; border: none; border-radius: 10px; font-size: 1rem;
    font-weight: 700; font-family: inherit; cursor: pointer; background: #1e7d42; color: #fff;
  }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  button.action:hover:not(:disabled) { background: #17622f; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #4a7a5e; min-height: 1.2em; }
  .swap-item { background: #f2fbf5; border: 1px solid #cdeedb; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .swap-name { font-weight: 700; color: #1e7d42; margin-bottom: 3px; }
  .swap-note { font-size: 0.9rem; color: #2f5c41; }
  #resultBox { margin-top: 18px; }
  .footer-note { color: #4a7a5e; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid #cdeedb;
    border-top-color: #1e7d42; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🛒</div>
    <h1>Budget-Friendly Grocery Swap Suggester</h1>
    <p class="subtitle">Enter an expensive grocery item, get cheaper alternatives. 100% on-device.</p>

    <div class="card">
      <label for="mainInput">Expensive grocery item</label>
      <input type="text" id="mainInput" placeholder="e.g. salmon fillets, imported cheese, fresh berries" />
      <button class="action" id="generateBtn">Find Cheaper Swaps</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Thinking of cheaper swaps...';

      try {
        const res = await fetch('/api/swap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ item: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = data.swaps.map(s => `
          <div class="swap-item">
            <div class="swap-name">${escapeHtml(s.name)}</div>
            ${s.note ? `<div class="swap-note">${escapeHtml(s.note)}</div>` : ''}
          </div>
        `).join('');
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    mainInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
